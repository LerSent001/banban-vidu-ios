name: BedroomRoom
options:
  bundleIdPrefix: com.lersent
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  BedroomRoom:
    type: application
    platform: iOS
    sources:
      - Room/Sources
      - path: Room/Resources
        excludes: [VoiceSamples]
        buildPhase: resources
      - path: Room/Resources/VoiceSamples
        type: folder
        buildPhase: resources
    info:
      path: Room/Info.plist
      properties:
        CFBundleDisplayName: 伴伴
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: 用于和房间里的人物实时语音聊天。
        NSSpeechRecognitionUsageDescription: 将你说的话识别成文字并发送给数字人，文字不会显示在通话界面。
        NSCameraUsageDescription: 开启我的画面时，使用前置摄像头显示你的视频预览。
        NSLocalNetworkUsageDescription: 连接本机运行的数字人服务。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        UIUserInterfaceStyle: Light
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lersent.bedroomroom
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: 1
schemes:
  BedroomRoom:
    build:
      targets:
        BedroomRoom: all
    run:
      config: Debug
